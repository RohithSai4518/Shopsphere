{% extends 'base.html' %}

{% block title %}Create Account — ShopSphere{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create your ShopSphere Account</h2>
        <form method="POST" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" required placeholder="Alex">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" required placeholder="Mercer">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="alex@domain.local">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="At least 8 characters">
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="is_seller" id="seller-check" onchange="document.getElementById('biz-group').style.display = this.checked ? 'block' : 'none';">
                    Register as a Merchant Seller on ShopSphere
                </label>
            </div>

            <div class="form-group" id="biz-group" style="display:none;">
                <label>Business / Merchant Name</label>
                <input type="text" name="business_name" placeholder="Apex Enterprise Electronics">
            </div>

            <button type="submit" class="btn-auth-primary">Create Account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{% url 'accounts:login' %}">Sign In</a></p>
    </div>
</div>
{% endblock %}
