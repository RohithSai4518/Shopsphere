{% extends 'base.html' %}

{% block title %}Create Account — ShopSphere Global Marketplace{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-badge" style="margin: 0 auto 16px; width: 44px; height: 44px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
            <h2>Create Your Account</h2>
            <p>Join ShopSphere to buy or sell premier certified hardware</p>
        </div>

        <form method="POST" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" required placeholder="Alex">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" required placeholder="Mercer">
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="alex@domain.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Minimum 8 characters">
            </div>

            <div class="form-group" style="margin: 20px 0;">
                <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:600; color:#fff;">
                    <input type="checkbox" name="is_seller" id="seller-check" onchange="document.getElementById('biz-group').style.display = this.checked ? 'block' : 'none';" style="width:18px; height:18px; accent-color:var(--primary-light);">
                    <span>Register as a Merchant Seller on ShopSphere</span>
                </label>
            </div>

            <div class="form-group" id="biz-group" style="display:none; padding:16px; background:rgba(255,255,255,0.02); border:1px solid var(--border-subtle); border-radius:var(--border-radius-md);">
                <label>Registered Business / Brand Name</label>
                <input type="text" name="business_name" placeholder="Apex Enterprise Tech">
            </div>

            <button type="submit" class="btn-auth-primary">Create Account</button>
        </form>

        <p class="auth-links">Already have an account? <a href="{% url 'accounts:login' %}">Sign In</a></p>
    </div>
</div>
{% endblock %}
