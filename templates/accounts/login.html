{% extends 'base.html' %}

{% block title %}Sign In — ShopSphere Global Marketplace{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-badge" style="margin: 0 auto 16px; width: 48px; height: 48px;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.5 7A4.5 4.5 0 0 0 8 8.5c0 3.5 8 2.5 8 6.5A4.5 4.5 0 0 1 7.5 17" />
                    <circle cx="17.5" cy="7" r="1.5" fill="currentColor" stroke="none" />
                    <circle cx="7.5" cy="17" r="1.5" fill="currentColor" stroke="none" />
                </svg>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to your ShopSphere account to track orders & manage cart</p>
        </div>

        <form method="POST" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" id="login-email" required placeholder="name@domain.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-auth-primary">Sign In</button>
        </form>

        <div class="demo-logins-box">
            <h4>Quick Demo Access</h4>
            <div class="demo-btn-row">
                <button type="button" class="btn-demo-fill" onclick="fillCreds('merchant@shopsphere.local', 'MerchantPass123!')">Seller</button>
                <button type="button" class="btn-demo-fill" onclick="fillCreds('governance@shopsphere.local', 'AdminMaster2026!')">Admin</button>
                <button type="button" class="btn-demo-fill" onclick="fillCreds('alex.customer@example.com', 'SecureCustomer2026!')">Customer</button>
            </div>
        </div>

        <p class="auth-links">New to ShopSphere? <a href="{% url 'accounts:register' %}">Create an account</a></p>
    </div>
</div>

<script>
    function fillCreds(email, pass) {
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').value = pass;
    }
</script>
{% endblock %}
