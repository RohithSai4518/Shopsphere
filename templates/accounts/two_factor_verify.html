{% extends 'base.html' %}

{% block title %}Security Verification — ShopSphere 2FA{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 460px; margin: 60px auto; padding: 0 20px;">
    <div class="auth-card" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--border-radius-lg); padding: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
        <div class="auth-header" style="text-align: center; margin-bottom: 24px;">
            <div class="logo-badge" style="margin: 0 auto 16px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: rgba(99, 102, 241, 0.15); border-radius: 12px; color: var(--primary-light);">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2 style="font-size: 1.5rem; color: #ffffff; margin-bottom: 6px;">Two-Factor Challenge</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Enter the 6-digit security code from your authenticator app for <strong style="color: #fff;">{{ user_email }}</strong>
            </p>
        </div>

        <form method="POST" action="{% url 'accounts:two_factor_verify' %}" id="totp-form">
            {% csrf_token %}
            <input type="hidden" name="is_backup" id="is_backup_input" value="0">
            
            <div class="form-group" style="margin-bottom: 24px; text-align: center;">
                <label id="code-label" style="display: block; font-size: 0.88rem; font-weight: 600; color: #ffffff; margin-bottom: 8px;">6-Digit TOTP Code</label>
                <input type="text" name="code" id="auth-code-input" required maxlength="9" placeholder="000000" autocomplete="one-time-code" autofocus style="width: 100%; padding: 14px; font-size: 1.6rem; letter-spacing: 4px; text-align: center; font-family: monospace; background: rgba(15,23,42,0.9); border: 1px solid var(--border-medium); border-radius: var(--border-radius-sm); color: #fff;">
            </div>

            <button type="submit" class="btn-auth-primary" style="width: 100%; padding: 12px; background: var(--primary); color: #fff; font-weight: 700; border: none; border-radius: var(--border-radius-sm); cursor: pointer; font-size: 1rem;">
                Verify & Authenticate
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <button type="button" id="toggle-backup-btn" style="background: none; border: none; color: var(--primary-light); font-size: 0.88rem; cursor: pointer; text-decoration: underline;">
                Use emergency backup code instead
            </button>
        </div>

        <p class="auth-links" style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-dim);">
            <a href="{% url 'accounts:login' %}" style="color: var(--text-muted);">Cancel and sign in as different user</a>
        </p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('toggle-backup-btn');
        const isBackupInput = document.getElementById('is_backup_input');
        const codeInput = document.getElementById('auth-code-input');
        const codeLabel = document.getElementById('code-label');

        let isBackupMode = false;

        toggleBtn.addEventListener('click', function() {
            isBackupMode = !isBackupMode;
            if (isBackupMode) {
                isBackupInput.value = '1';
                codeLabel.textContent = 'Emergency Recovery Backup Code (e.g. A1B2-C3D4)';
                codeInput.placeholder = 'XXXX-XXXX';
                codeInput.maxLength = 12;
                toggleBtn.textContent = 'Use 6-digit authenticator app code instead';
            } else {
                isBackupInput.value = '0';
                codeLabel.textContent = '6-Digit TOTP Code';
                codeInput.placeholder = '000000';
                codeInput.maxLength = 6;
                toggleBtn.textContent = 'Use emergency backup code instead';
            }
            codeInput.value = '';
            codeInput.focus();
        });
    });
</script>
{% endblock %}
