{% extends 'base.html' %}

{% block title %}Reset Your Password — ShopSphere{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 480px; margin: 60px auto; padding: 0 20px;">
    <div class="auth-card" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--border-radius-lg); padding: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
        <div class="auth-header" style="text-align: center; margin-bottom: 28px;">
            <div class="logo-badge" style="margin: 0 auto 16px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: rgba(99, 102, 241, 0.15); border-radius: 12px; color: var(--primary-light);">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2 style="font-size: 1.6rem; color: #ffffff; margin-bottom: 8px;">Reset Password</h2>
            <p style="color: var(--text-muted); font-size: 0.92rem; line-height: 1.4;">Enter your verified account email address to receive secure recovery credentials.</p>
        </div>

        <form method="POST" action="{% url 'accounts:password_reset_request' %}">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #ffffff; margin-bottom: 6px;">Email Address</label>
                <input type="email" name="email" required placeholder="name@domain.com" autocomplete="email" style="width: 100%; padding: 12px 14px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-medium); border-radius: var(--border-radius-sm); color: #fff; font-size: 0.95rem;">
            </div>
            <button type="submit" class="btn-auth-primary" style="width: 100%; padding: 12px; background: var(--primary); color: #fff; font-weight: 700; border: none; border-radius: var(--border-radius-sm); cursor: pointer; font-size: 1rem;">
                Send Recovery Instructions
            </button>
        </form>

        <p class="auth-links" style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary);">
            Remember your password? <a href="{% url 'accounts:login' %}" style="color: var(--primary-light); text-decoration: underline;">Back to Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
