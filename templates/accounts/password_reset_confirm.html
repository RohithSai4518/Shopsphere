{% extends 'base.html' %}

{% block title %}Set New Password — ShopSphere{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 480px; margin: 60px auto; padding: 0 20px;">
    <div class="auth-card" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--border-radius-lg); padding: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
        <div class="auth-header" style="text-align: center; margin-bottom: 28px;">
            <div class="logo-badge" style="margin: 0 auto 16px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: rgba(99, 102, 241, 0.15); border-radius: 12px; color: var(--primary-light);">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
            <h2 style="font-size: 1.6rem; color: #ffffff; margin-bottom: 8px;">Create New Password</h2>
            <p style="color: var(--text-muted); font-size: 0.92rem;">Choose a strong, unique password for your account.</p>
        </div>

        <form method="POST" action="{% url 'accounts:password_reset_confirm' token=token %}">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #ffffff; margin-bottom: 6px;">New Password</label>
                <input type="password" name="new_password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password" style="width: 100%; padding: 12px 14px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-medium); border-radius: var(--border-radius-sm); color: #fff; font-size: 0.95rem;">
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #ffffff; margin-bottom: 6px;">Confirm New Password</label>
                <input type="password" name="confirm_password" required minlength="8" placeholder="Re-enter new password" autocomplete="new-password" style="width: 100%; padding: 12px 14px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-medium); border-radius: var(--border-radius-sm); color: #fff; font-size: 0.95rem;">
            </div>
            <button type="submit" class="btn-auth-primary" style="width: 100%; padding: 12px; background: var(--primary); color: #fff; font-weight: 700; border: none; border-radius: var(--border-radius-sm); cursor: pointer; font-size: 1rem;">
                Update Password & Secure Account
            </button>
        </form>
    </div>
</div>
{% endblock %}
