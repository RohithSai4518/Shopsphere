{% extends 'base.html' %}

{% block title %}Add Product Listing — ShopSphere Seller Center{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="max-width:700px;">
        <h2>Create New Product Listing</h2>
        <form method="POST" action="{% url 'sellers:product_create' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Product Title / Name</label>
                <input type="text" name="name" required placeholder="e.g. Novata UltraBook Pro 15">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Category</label>
                    <select name="category" required>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Brand</label>
                    <select name="brand">
                        {% for brd in brands %}
                            <option value="{{ brd.id }}">{{ brd.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Base Price ($)</label>
                <input type="number" step="0.01" name="base_price" required placeholder="1299.99">
            </div>

            <div class="form-group">
                <label>Description & Technical Features</label>
                <textarea name="description" rows="5" required placeholder="Enter product overview..."></textarea>
            </div>

            <button type="submit" class="btn-auth-primary">Publish Product Listing</button>
        </form>
    </div>
</div>
{% endblock %}
